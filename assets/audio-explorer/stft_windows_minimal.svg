<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 760" role="img" aria-labelledby="title desc">
  <title id="title">Short-time Fourier transform windows</title>
  <desc id="desc">Overlapping windows slide over a waveform and become columns in a spectrogram.</desc>
  <rect width="1440" height="760" fill="#f7f4ee"/>
  <g font-family="Inter, Arial, sans-serif">
    <text x="92" y="104" fill="#8a8174" font-size="16" letter-spacing="3">SHORT-TIME FOURIER TRANSFORM</text>
    <text x="92" y="146" fill="#111111" font-size="42" font-weight="700">The song is analyzed as many local moments</text>
  </g>
  <g transform="translate(90 260)">
    <path d="M0 120 C60 20 120 220 180 120 C240 20 300 220 360 120 C420 20 480 220 540 120 C600 20 660 220 720 120 C780 20 840 220 900 120" fill="none" stroke="#111111" stroke-width="6" stroke-linecap="round"/>
    <g fill="#ffffff" stroke-width="3">
      <rect x="80" y="0" width="190" height="240" rx="18" fill="#ffffff" fill-opacity=".66" stroke="#b45309"/>
      <rect x="210" y="0" width="190" height="240" rx="18" fill="#ffffff" fill-opacity=".66" stroke="#4c7a67"/>
      <rect x="340" y="0" width="190" height="240" rx="18" fill="#ffffff" fill-opacity=".66" stroke="#4f648f"/>
      <rect x="470" y="0" width="190" height="240" rx="18" fill="#ffffff" fill-opacity=".66" stroke="#8b7355"/>
    </g>
    <g font-family="Inter, Arial, sans-serif" fill="#69635a" font-size="18">
      <text x="118" y="284">window</text>
      <text x="250" y="284">hop</text>
      <text x="498" y="284">overlap keeps motion continuous</text>
    </g>
  </g>
  <g transform="translate(1040 230)">
    <rect width="300" height="300" rx="20" fill="#ffffff" stroke="#d8d1c3"/>
    <g>
      <rect x="42" y="44" width="34" height="212" fill="#f1c27a"/>
      <rect x="82" y="78" width="34" height="178" fill="#d99a66"/>
      <rect x="122" y="26" width="34" height="230" fill="#b86d4b"/>
      <rect x="162" y="112" width="34" height="144" fill="#6f8b77"/>
      <rect x="202" y="64" width="34" height="192" fill="#51698e"/>
    </g>
    <text x="42" y="338" fill="#69635a" font-family="Inter, Arial, sans-serif" font-size="18">each window becomes one column</text>
  </g>
</svg>
