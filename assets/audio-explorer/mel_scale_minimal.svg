<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 760" role="img" aria-labelledby="title desc">
  <title id="title">Linear frequency compared with Mel scale</title>
  <desc id="desc">A minimal comparison of equally spaced frequency bins and perceptually spaced Mel bands.</desc>
  <rect width="1440" height="760" fill="#f7f4ee"/>
  <g font-family="Inter, Arial, sans-serif">
    <text x="92" y="104" fill="#8a8174" font-size="16" letter-spacing="3">MEL SCALE</text>
    <text x="92" y="146" fill="#111111" font-size="42" font-weight="700">The model sees frequency closer to how we hear it</text>
    <text x="120" y="276" fill="#111111" font-size="24" font-weight="700">Linear bins</text>
    <text x="120" y="486" fill="#111111" font-size="24" font-weight="700">Mel bands</text>
  </g>
  <g transform="translate(320 250)" stroke="#d8d1c3" stroke-width="2">
    <line x1="0" y1="0" x2="920" y2="0"/>
    <line x1="0" y1="210" x2="920" y2="210"/>
  </g>
  <g transform="translate(320 250)" stroke-linecap="round">
    <g stroke="#111111" stroke-width="4">
      <line x1="0" y1="-42" x2="0" y2="42"/>
      <line x1="115" y1="-42" x2="115" y2="42"/>
      <line x1="230" y1="-42" x2="230" y2="42"/>
      <line x1="345" y1="-42" x2="345" y2="42"/>
      <line x1="460" y1="-42" x2="460" y2="42"/>
      <line x1="575" y1="-42" x2="575" y2="42"/>
      <line x1="690" y1="-42" x2="690" y2="42"/>
      <line x1="805" y1="-42" x2="805" y2="42"/>
      <line x1="920" y1="-42" x2="920" y2="42"/>
    </g>
    <g stroke="#b45309" stroke-width="4">
      <line x1="0" y1="168" x2="0" y2="252"/>
      <line x1="58" y1="168" x2="58" y2="252"/>
      <line x1="124" y1="168" x2="124" y2="252"/>
      <line x1="202" y1="168" x2="202" y2="252"/>
      <line x1="300" y1="168" x2="300" y2="252"/>
      <line x1="426" y1="168" x2="426" y2="252"/>
      <line x1="590" y1="168" x2="590" y2="252"/>
      <line x1="740" y1="168" x2="740" y2="252"/>
      <line x1="920" y1="168" x2="920" y2="252"/>
    </g>
  </g>
  <g font-family="Inter, Arial, sans-serif" fill="#69635a" font-size="18">
    <text x="318" y="342">0 Hz</text>
    <text x="1208" y="342">11 kHz</text>
    <text x="318" y="552">0 Mel</text>
    <text x="1166" y="552">perceptual high end</text>
    <text x="430" y="636">more resolution where pitch differences matter most</text>
  </g>
</svg>
