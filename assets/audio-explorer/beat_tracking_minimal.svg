<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 760" role="img" aria-labelledby="title desc">
  <title id="title">Beat tracking from onset strength</title>
  <desc id="desc">A waveform with onset peaks is aligned to beat markers and summarized as tempo and beat intervals.</desc>
  <rect width="1440" height="760" fill="#f7f4ee"/>
  <g font-family="Inter, Arial, sans-serif">
    <text x="92" y="104" fill="#8a8174" font-size="16" letter-spacing="3">RHYTHM BRANCH</text>
    <text x="92" y="146" fill="#111111" font-size="42" font-weight="700">Beat tracking looks for repeated moments of attack</text>
  </g>
  <g transform="translate(110 265)">
    <path d="M0 130 C30 90 60 170 90 130 C120 88 150 172 180 130 C210 92 240 168 270 130 C300 88 330 172 360 130 C390 95 420 165 450 130 C480 88 510 172 540 130 C570 92 600 168 630 130 C660 88 690 172 720 130 C750 96 780 164 810 130 C840 88 870 172 900 130 C930 94 960 166 990 130 C1020 88 1050 172 1080 130 C1110 96 1140 164 1170 130" fill="none" stroke="#111111" stroke-width="5" stroke-linecap="round"/>
    <g stroke="#b45309" stroke-width="4">
      <line x1="78" y1="44" x2="78" y2="216"/>
      <line x1="252" y1="44" x2="252" y2="216"/>
      <line x1="426" y1="44" x2="426" y2="216"/>
      <line x1="600" y1="44" x2="600" y2="216"/>
      <line x1="774" y1="44" x2="774" y2="216"/>
      <line x1="948" y1="44" x2="948" y2="216"/>
      <line x1="1122" y1="44" x2="1122" y2="216"/>
    </g>
    <g fill="#b45309">
      <circle cx="78" cy="44" r="9"/>
      <circle cx="252" cy="44" r="9"/>
      <circle cx="426" cy="44" r="9"/>
      <circle cx="600" cy="44" r="9"/>
      <circle cx="774" cy="44" r="9"/>
      <circle cx="948" cy="44" r="9"/>
      <circle cx="1122" cy="44" r="9"/>
    </g>
    <g font-family="Inter, Arial, sans-serif" fill="#69635a" font-size="18">
      <text x="74" y="260">onset</text>
      <text x="326" y="260">consistent spacing becomes tempo</text>
    </g>
  </g>
  <g transform="translate(930 548)" font-family="Inter, Arial, sans-serif">
    <rect width="340" height="96" rx="18" fill="#ffffff" stroke="#d8d1c3"/>
    <text x="28" y="42" fill="#111111" font-size="24" font-weight="700">BPM + beat times</text>
    <text x="28" y="70" fill="#69635a" font-size="17">a pulse map for the whole track</text>
  </g>
</svg>
