<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 760" role="img" aria-labelledby="title desc">
  <title id="title">Audio Explorer app architecture</title>
  <desc id="desc">A minimal map of the Streamlit app, shared audio data object, compute modules, and Plotly rendering layer.</desc>
  <rect width="1440" height="760" fill="#f7f4ee"/>
  <g font-family="Inter, Arial, sans-serif">
    <text x="92" y="104" fill="#8a8174" font-size="16" letter-spacing="3">APP ARCHITECTURE</text>
    <text x="92" y="146" fill="#111111" font-size="42" font-weight="700">One shared audio object keeps the app understandable</text>
  </g>
  <g font-family="Inter, Arial, sans-serif">
    <g transform="translate(130 300)">
      <rect width="260" height="150" rx="20" fill="#111111"/>
      <text x="32" y="58" fill="#ffffff" font-size="26" font-weight="700">app.py</text>
      <text x="32" y="92" fill="#cfc8bc" font-size="18">Streamlit controls</text>
    </g>
    <g transform="translate(520 280)">
      <rect width="300" height="190" rx="20" fill="#ffffff" stroke="#d8d1c3"/>
      <text x="32" y="60" fill="#111111" font-size="26" font-weight="700">AudioFile</text>
      <text x="32" y="94" fill="#69635a" font-size="18">samples, sample rate,</text>
      <text x="32" y="122" fill="#69635a" font-size="18">duration, metadata</text>
    </g>
    <g transform="translate(950 200)">
      <rect width="320" height="86" rx="18" fill="#fffaf0" stroke="#d7b27a"/>
      <text x="28" y="53" fill="#111111" font-size="22" font-weight="700">compute_waveform()</text>
    </g>
    <g transform="translate(950 314)">
      <rect width="320" height="86" rx="18" fill="#eef6f2" stroke="#9fbea8"/>
      <text x="28" y="53" fill="#111111" font-size="22" font-weight="700">compute_stft()</text>
    </g>
    <g transform="translate(950 428)">
      <rect width="320" height="86" rx="18" fill="#eef3fb" stroke="#aab9d7"/>
      <text x="28" y="53" fill="#111111" font-size="22" font-weight="700">compute_mfcc()</text>
    </g>
    <g transform="translate(950 542)">
      <rect width="320" height="86" rx="18" fill="#ffffff" stroke="#d8d1c3"/>
      <text x="28" y="53" fill="#111111" font-size="22" font-weight="700">plotly figures</text>
    </g>
  </g>
  <g fill="none" stroke="#111111" stroke-width="3" stroke-linecap="round">
    <path d="M390 375 H500"/>
    <path d="M488 363 l16 12 l-16 12"/>
    <path d="M820 375 C875 375 884 243 930 243"/>
    <path d="M820 375 H930"/>
    <path d="M820 375 C875 375 884 471 930 471"/>
    <path d="M1110 514 V535"/>
    <path d="M1098 523 l12 14 l12 -14"/>
  </g>
</svg>
