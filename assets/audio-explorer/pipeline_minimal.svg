<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 760" role="img" aria-labelledby="title desc">
  <title id="title">Audio Explorer processing pipeline</title>
  <desc id="desc">A minimal diagram showing raw audio flowing into waveform analysis, STFT, Mel spectrogram, MFCCs, and a parallel rhythm branch.</desc>
  <rect width="1440" height="760" fill="#f7f4ee"/>
  <g fill="none" stroke="#d8d1c3" stroke-width="2">
    <path d="M160 410 H1280"/>
    <path d="M390 410 C390 540 550 540 550 630"/>
    <path d="M390 410 C390 315 550 315 550 265"/>
  </g>
  <g font-family="Inter, Arial, sans-serif">
    <g transform="translate(90 350)">
      <rect width="170" height="120" rx="18" fill="#ffffff" stroke="#d8d1c3"/>
      <text x="28" y="48" fill="#1d1d1d" font-size="24" font-weight="700">Audio file</text>
      <text x="28" y="78" fill="#69635a" font-size="16">MP3 / WAV / FLAC</text>
    </g>
    <g transform="translate(330 350)">
      <rect width="170" height="120" rx="18" fill="#111111"/>
      <text x="28" y="48" fill="#ffffff" font-size="24" font-weight="700">Waveform</text>
      <text x="28" y="78" fill="#cfc8bc" font-size="16">1D samples</text>
    </g>
    <g transform="translate(570 350)">
      <rect width="170" height="120" rx="18" fill="#ffffff" stroke="#d8d1c3"/>
      <text x="28" y="48" fill="#1d1d1d" font-size="24" font-weight="700">STFT</text>
      <text x="28" y="78" fill="#69635a" font-size="16">time + frequency</text>
    </g>
    <g transform="translate(810 350)">
      <rect width="170" height="120" rx="18" fill="#ffffff" stroke="#d8d1c3"/>
      <text x="28" y="48" fill="#1d1d1d" font-size="24" font-weight="700">Mel bands</text>
      <text x="28" y="78" fill="#69635a" font-size="16">human scale</text>
    </g>
    <g transform="translate(1050 350)">
      <rect width="170" height="120" rx="18" fill="#ffffff" stroke="#d8d1c3"/>
      <text x="28" y="48" fill="#1d1d1d" font-size="24" font-weight="700">MFCCs</text>
      <text x="28" y="78" fill="#69635a" font-size="16">compact shape</text>
    </g>
    <g transform="translate(570 205)">
      <rect width="210" height="120" rx="18" fill="#fffaf0" stroke="#d7b27a"/>
      <text x="28" y="48" fill="#1d1d1d" font-size="24" font-weight="700">Signal health</text>
      <text x="28" y="78" fill="#76634a" font-size="16">RMS, clipping, DC</text>
    </g>
    <g transform="translate(570 570)">
      <rect width="210" height="120" rx="18" fill="#eef6f2" stroke="#9fbea8"/>
      <text x="28" y="48" fill="#1d1d1d" font-size="24" font-weight="700">Rhythm branch</text>
      <text x="28" y="78" fill="#55705e" font-size="16">onsets, BPM, beats</text>
    </g>
    <text x="90" y="96" fill="#8a8174" font-size="16" letter-spacing="3">AUDIO EXPLORER</text>
    <text x="90" y="136" fill="#111111" font-size="42" font-weight="700">One file, several useful representations</text>
  </g>
  <g stroke="#111111" stroke-width="3" stroke-linecap="round">
    <path d="M277 410 h28"/>
    <path d="M297 400 l12 10 l-12 10"/>
    <path d="M517 410 h28"/>
    <path d="M537 400 l12 10 l-12 10"/>
    <path d="M757 410 h28"/>
    <path d="M777 400 l12 10 l-12 10"/>
    <path d="M997 410 h28"/>
    <path d="M1017 400 l12 10 l-12 10"/>
  </g>
</svg>
